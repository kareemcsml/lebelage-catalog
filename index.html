            --text-dark: #1A1A1A;

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #2c2c2c;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .print-btn-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .btn-print {
            background: linear-gradient(135deg, #B8860B, var(--gold-dark));
            color: white;
            border: 2px solid var(--gold-secondary);
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .btn-print:hover { transform: scale(1.05); }

        .page {
            width: 210mm;
            height: 297mm;
            background-color: var(--bg-color);
            padding: 12mm 15mm;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            page-break-after: always;
            page-break-inside: avoid;
            overflow: hidden;
        }

        /* إطار فاخر ملكي */
        .page-border {
            position: absolute;
            top: 6mm; bottom: 6mm; left: 6mm; right: 6mm;
            border: 1px solid var(--gold-primary);
            pointer-events: none;
            padding: 4px;
            z-index: 2;
        }

        .page-border-inner {
            width: 100%; height: 100%;
            border: 1px solid var(--gold-dark);
            opacity: 0.3;
        }

        /* الزخارف الملكية الفخمة في الزوايا بدلاً من الـ SVG */
        .royal-corner {
            position: absolute;
            font-size: 2rem;
            color: var(--gold-primary);
            z-index: 5;
            opacity: 0.85;
            text-shadow: 0 2px 5px rgba(153, 101, 21, 0.3);
        }
        
        .corner-tl { top: 8mm; left: 10mm; }
        .corner-tr { top: 8mm; right: 10mm; }
        .corner-bl { bottom: 8mm; left: 10mm; }
        .corner-br { bottom: 8mm; right: 10mm; }

            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);

        .cover-title {
