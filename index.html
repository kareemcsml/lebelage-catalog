        :root {
            --bg-color: #FAF8F5;
            --gold-primary: #D4AF37;
            --gold-secondary: #F3E5AB;
            --gold-dark: #996515;
            --text-dark: #1A1A1A;
            --text-muted: #555555;
            --border-color: #E8E2D5;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        html, body {
            width: 100%;
            background-color: #2c2c2c;
            color: var(--text-dark);
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        .print-btn-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .btn-print {
            background: linear-gradient(135deg, #B8860B, var(--gold-dark));
            color: white;
            border: 2px solid var(--gold-secondary);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .btn-print:hover { transform: scale(1.05); }

        /* تعديل تجاوب الصفحة للشاشات العادية والموبايل */
        .page {
            width: 100%;
            max-width: 210mm;
            min-height: 297mm;
            aspect-ratio: 210 / 297;
            background-color: var(--bg-color);
            padding: 12mm 15mm;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            page-break-after: always;
            break-after: page;
            overflow: hidden;
        }

        .page:last-child {
            page-break-after: avoid !important;
            break-after: avoid !important;
        }

        /* إطار فاخر */
        .page-border {
            position: absolute;
            top: 6mm; bottom: 6mm; left: 6mm; right: 6mm;
            border: 1px solid var(--gold-primary);
            pointer-events: none;
            padding: 4px;
            z-index: 2;
        }

        .page-border-inner {
            width: 100%; height: 100%;
            border: 1px solid var(--gold-dark);
            opacity: 0.3;
        }

        /* الزخارف */
        .royal-corner {
            position: absolute;
            font-size: 1.8rem;
            color: var(--gold-primary);
            z-index: 5;
            opacity: 0.85;
            text-shadow: 0 2px 5px rgba(153, 101, 21, 0.3);
        }
        
        .corner-tl { top: 8mm; left: 8mm; }
        .corner-tr { top: 8mm; right: 8mm; }
        .corner-bl { bottom: 8mm; left: 8mm; }
        .corner-br { bottom: 8mm; right: 8mm; }

        /* الغلاف */
        .cover-page {
            background: linear-gradient(135deg, #FAF8F5 0%, #F5EFE6 100%);
            color: var(--text-dark);
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 2px solid var(--gold-primary);
        }

        .cover-border {
            position: absolute;
            top: 8mm; bottom: 8mm; left: 8mm; right: 8mm;
            border: 2px solid var(--gold-primary);
            pointer-events: none;
            padding: 6px;
            z-index: 2;
        }
        .cover-border-inner {
            width: 100%; height: 100%;
            border: 1px solid var(--gold-dark);
            opacity: 0.4;
        }

        .cover-content {
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 160mm;
            padding: 0 10px;
        }

        /* الشعار */
        .brand-logo-svg {
            width: 100%;
            max-width: 340px;
            height: auto;
            margin-bottom: 5px;
        }

        .cover-korean {
            font-size: 1.2rem;
            color: #333333;
            letter-spacing: 4px;
            margin-top: 5px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .cover-divider {
            color: var(--gold-primary);
            font-size: 1.2rem;
            letter-spacing: 8px;
            margin: 6px 0;
        }

        .cover-subtitle {
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: var(--text-dark);
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .cover-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.6;
            border-top: 1px solid rgba(212, 175, 55, 0.4);
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 0;
            margin-bottom: 10px;
        }

        .cover-badge {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
            color: #FFFFFF;
            padding: 6px 22px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
            border: 1px solid var(--gold-secondary);
        }

        /* قسم بيانات التواصل */
        .contact-info-container {
            margin-top: 12px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--gold-primary);
            border-radius: 12px;
            width: 100%;
            max-width: 140mm;
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.12);
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: right;
        }

        .contact-item {
            font-size: 0.82rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .contact-icon {
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }

        .icon-location { color: #d9534f; }
        .icon-whatsapp { color: #25D366; }
        .icon-facebook { color: #1877F2; }
        .icon-instagram { color: #E4405F; }
        .icon-email { color: #EA4335; }

        .contact-item a {
            color: var(--gold-dark);
            text-decoration: none;
            font-weight: bold;
        }

        /* هيدر الصفحة */
        .header { text-align: center; width: 100%; margin-top: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; }
        .brand-korean { font-size: 0.85rem; color: var(--gold-dark); font-weight: 700; }
        .brand-sub { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }

        .badge-container {
            width: 90%; display: flex; justify-content: space-between; align-items: center; margin-top: 1mm; z-index: 3;
        }
        .badge-code, .badge-no {
            background: #FFF; border: 1px solid var(--gold-primary); color: var(--gold-dark);

            box-shadow: 0 2px 5px rgba(212, 175, 55, 0.2);

        .product-image-container {

            border: 2px solid var(--gold-primary);

            z-index: 3;
        }

            width: 100%;

            object-fit: cover;

            text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 1mm; z-index: 3;

            .corner-bl { bottom: 6px; left: 6px; font-size: 1.2rem; }

            .product-description { font-size: 0.75rem; padding: 6px 8px; }
            .print-btn-container { top: 10px; left: 10px; }
            .btn-print { padding: 8px 16px; font-size: 0.8rem; }
            .contact-info-container { padding: 8px 10px; }
            .contact-item { font-size: 0.72rem; gap: 6px; }
